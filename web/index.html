<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SearchIT compare les prix du high-tech neuf, reconditionné et d'occasion chez Amazon, Fnac, LDLC, Back Market, Leclerc, AliExpress et bien d'autres." />
    <meta name="theme-color" content="#4f46e5" />
    <title>SearchIT</title>
    <script>
      // Applique le thème avant le premier rendu (évite le flash clair/sombre).
      try {
        var t = localStorage.getItem('searchit:theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
