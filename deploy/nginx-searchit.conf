# Alternative sans Docker : nginx + certbot devant le service systemd (deploy/searchit.service).
#   sudo cp deploy/nginx-searchit.conf /etc/nginx/sites-available/searchit
#   sudo ln -s /etc/nginx/sites-available/searchit /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d searchit.heiphaistos.org
server {
    listen 80;
    listen [::]:80;
    server_name searchit.heiphaistos.org;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        proxy_pass http://127.0.0.1:8787;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
